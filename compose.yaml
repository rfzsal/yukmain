# Deployment-safe base: publish no host ports.
# For local localhost access, add -f compose.local.yaml.
services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    # Private network: prevents a conflicting/stale API DNS target on
    # EasyPanel's public/default Docker network.
    networks:
      backend:
        aliases:
          - yukmain-api-internal
    environment:
      PORT: "8080"
    expose:
      - "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
    restart: unless-stopped
    # Keep default network for the EasyPanel ingress and a separate
    # backend network exclusively for nginx -> Go communication.
    networks:
      - default
      - backend
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Health of the web gateway must not depend on availability of the API.
      # The API has its own separate healthcheck above.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  backend:
    internal: true
